<!doctype html>
<html><head><title>Inheritance</title>
<style>
body { font-size: 18px; line-height: 1.5; }
.small { font-size: 14px; }
.serif { font-family: serif; }
.box { border: 1px solid #888; padding: 10px; color: #800; }
</style></head>
<body>
<p>Body font size 18 inherited.</p>
<div class="small"><p>Inherited 14px.</p><ul><li>List item 14px</li></ul></div>
<div class="box"><p>Inherited color, but not border.</p></div>
</body></html>
