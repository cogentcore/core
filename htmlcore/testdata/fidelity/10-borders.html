<!doctype html>
<html><head><title>Borders</title>
<style>
div { margin: 10px; padding: 8px; }
.solid { border: 2px solid black; }
.dashed { border: 2px dashed #a33; }
.dotted { border: 3px dotted #33a; }
.thick { border: 8px solid #3a3; }
.sides { border-top: 4px solid red; border-bottom: 4px solid blue; }
.left { border-left: 6px solid orange; }
.round { border: 2px solid #555; border-radius: 10px; }
.color { border-width: 3px; border-style: solid; border-color: purple; }
</style></head>
<body>
<div class="solid">Solid 2px</div>
<div class="dashed">Dashed 2px</div>
<div class="dotted">Dotted 3px</div>
<div class="thick">Solid 8px</div>
<div class="sides">Top and bottom</div>
<div class="left">Left only</div>
<div class="round">Rounded corners</div>
<div class="color">Longhand properties</div>
</body></html>
