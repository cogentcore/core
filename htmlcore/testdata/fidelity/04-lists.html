<!doctype html>
<html><head><title>Lists</title></head>
<body>
<p>Unordered:</p>
<ul>
<li>First item</li>
<li>Second item</li>
<li>Third item</li>
</ul>
<p>Ordered:</p>
<ol>
<li>One</li>
<li>Two</li>
<li>Three</li>
</ol>
<p>Nested:</p>
<ul>
<li>Outer one
  <ul>
  <li>Inner one</li>
  <li>Inner two</li>
  </ul>
</li>
<li>Outer two</li>
</ul>
<p>After lists.</p>
</body></html>
