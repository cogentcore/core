<!DOCTYPE html>
<html>
<head>
<style>
body { margin: 8px; font-size: 16px; }
ul.index { columns: 12em; margin: 0; padding: 0; list-style: none; }
ol.count { column-count: 2; column-gap: 2em; }
</style>
</head>
<body>
<ul class="index">
<li>alpha</li><li>beta</li><li>gamma</li><li>delta</li><li>epsilon</li><li>zeta</li>
<li>eta</li><li>theta</li><li>iota</li><li>kappa</li><li>lambda</li><li>mu</li>
</ul>
<ol class="count">
<li>one</li><li>two</li><li>three</li><li>four</li>
</ol>
<p>After the columns.</p>
</body>
</html>
