<!doctype html>
<html><head><title>Tables CSS</title>
<style>
table { border-collapse: collapse; width: 100%; }
th, td { border: 1px solid #999; padding: 4px 8px; text-align: left; }
th { background-color: #ddd; }
.num { text-align: right; }
</style></head>
<body>
<table>
<tr><th>Item</th><th>Qty</th><th>Price</th></tr>
<tr><td>Apples</td><td class="num">3</td><td class="num">1.20</td></tr>
<tr><td>Bananas, a fruit with a long description that wraps</td><td class="num">12</td><td class="num">0.50</td></tr>
<tr><td colspan="2">Total</td><td class="num">9.60</td></tr>
</table>
</body></html>
