<!doctype html>
<html><head><title>Colors</title>
<style>
body { background-color: #f4f4f4; color: #333; }
.red { color: red; }
.hex { color: #2a7; }
.rgb { color: rgb(120, 40, 200); }
.bg { background-color: navy; color: white; }
.bgrgba { background-color: rgba(255, 0, 0, 0.25); }
.inherit { color: darkgreen; }
</style></head>
<body>
<p>Default body color on a gray background.</p>
<p class="red">Named red.</p>
<p class="hex">Hex #2a7.</p>
<p class="rgb">rgb(120, 40, 200).</p>
<p class="bg">White on navy.</p>
<p class="bgrgba">Translucent red background.</p>
<div class="inherit"><p>Inherited dark green.</p><p>Also <b>inherited</b>.</p></div>
</body></html>
