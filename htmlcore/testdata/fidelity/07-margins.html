<!doctype html>
<html><head><title>Margins</title>
<style>
div { background-color: #eed; }
.m10 { margin-top: 10px; margin-bottom: 10px; }
.m30 { margin-top: 30px; margin-bottom: 30px; }
.left { margin-left: 50px; }
.right { margin-right: 100px; }
.center { width: 300px; margin-left: auto; margin-right: auto; }
.pt { padding-top: 20px; }
.pl { padding-left: 40px; }
</style></head>
<body>
<div class="m10">margin 10 (collapses with the next)</div>
<div class="m30">margin 30</div>
<div class="left">margin-left 50</div>
<div class="right">margin-right 100</div>
<div class="center">centered 300 wide</div>
<div class="pt">padding-top 20</div>
<div class="pl">padding-left 40</div>
</body></html>
