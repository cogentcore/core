<!doctype html>
<html><head><title>Float</title>
<style>
.box { float: right; width: 200px; height: 150px; background-color: #cde; margin: 0 0 10px 10px; }
.left { float: left; width: 120px; height: 80px; background-color: #edc; margin: 0 10px 10px 0; }
.clear { clear: both; background-color: #eee; }
img.thumb { float: right; margin-left: 8px; }
</style></head>
<body>
<div class="box">Float right</div>
<p>A paragraph next to a box that floats to the right, as an infobox in an article, which is long enough to wrap onto a few lines.</p>
<p>A second paragraph, still beside the float.</p>
<div class="left">Float left</div>
<p>A paragraph beside a box that floats to the left.</p>
<div class="clear">Cleared, below the floats.</div>
<p>After.</p>
</body></html>
