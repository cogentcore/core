name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      updateTestdata:
        description: 'Update testdata images'
        required: true
        default: true
        type: boolean

jobs:

  build:
    runs-on: ubuntu-latest
    env:
      # the FFmpeg version required by the go-astiav version in go.mod (video)
      FFMPEG_VERSION: n9.0.2
      FFMPEG_PATH: /home/runner/ffmpeg
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.27.0'

    - name: Change Mirror Priorities
      uses: ./.github/actions/apt-mirrors

    - name: Set up Core
      run: go install && core setup

    - name: Install audio dependencies (video)
      run: sudo apt-get install -y libasound2-dev

    # apt does not have the FFmpeg version that go-astiav requires, so it is
    # built from source, as in the CI of go-astiav, and cached
    - name: Load FFmpeg cache
      id: ffmpeg-cache
      uses: actions/cache@v5
      with:
        path: ${{ env.FFMPEG_PATH }}
        key: ffmpeg-${{ env.FFMPEG_VERSION }}-${{ runner.os }}-${{ runner.arch }}

    - name: Build FFmpeg (video)
      if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
      run: |
        sudo apt-get install -y nasm
        git clone --depth 1 --branch "$FFMPEG_VERSION" https://github.com/FFmpeg/FFmpeg "$RUNNER_TEMP/ffmpeg-src"
        cd "$RUNNER_TEMP/ffmpeg-src"
        ./configure --prefix="$FFMPEG_PATH" --enable-shared --disable-static --disable-autodetect --disable-programs --disable-doc
        make -j"$(nproc)"
        make install

    - name: Set FFmpeg environment variables
      run: |
        echo "PKG_CONFIG_PATH=$FFMPEG_PATH/lib/pkgconfig" >> $GITHUB_ENV
        echo "LD_LIBRARY_PATH=$FFMPEG_PATH/lib" >> $GITHUB_ENV

    - name: Build
      run: go build -v ./...

    - name: Build Docs (to verify it works on PRs)
      run: core build js -dir docs -o static

    - name: Download testdata
      uses: dawidd6/action-download-artifact@v21
      with:
        name: testdata
        workflow_search: true
        search_artifacts: true
        if_no_artifact_found: warn

    - name: Set CORE_UPDATE_TESTDATA env var
      if: inputs.updateTestdata
      run: echo "CORE_UPDATE_TESTDATA=true" >> $GITHUB_ENV

    # TODO: we can't test gpu, xyz, system, and video on the CI since there is bad Vulkan support
    - name: Test
      run: go test -short -v $(go list ./... | grep -v gpu | grep -v xyz | grep -v system | grep -v video) -coverprofile cover.out -timeout 2m

    # the images of the snapshots of htmlcore are files of the pages, in the repository
    - name: Upload testdata
      uses: actions/upload-artifact@v7
      with:
        name: testdata
        path: |
          **/testdata/**/*.png
          !htmlcore/testdata/snapshots/**

    - name: Upload failure testdata
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: testdata-fail
        path: "**/testdata/**/*.png"

    - name: Update coverage report
      uses: ncruces/go-coverage-report@v0
      with:
        coverage-file: cover.out
      if: github.event_name == 'push'
