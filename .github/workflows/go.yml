name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      updateTestdata:
        description: 'Update testdata images'
        required: true
        default: true
        type: boolean

jobs:

  build:
    # 24.04, not latest (26.04), for which ppa:savoury1/ffmpeg4 has no packages,
    # so that apt installs ffmpeg 7+, without swr_alloc_set_opts, which reisen
    # (video) uses; remove this when the video package no longer uses reisen
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.27.0'

    - name: Change Mirror Priorities
      uses: ./.github/actions/apt-mirrors

    - name: Set up Core
      run: go install && core setup

    - name: "Install video dependencies (TODO: move to a command)"
      run: sudo add-apt-repository ppa:savoury1/ffmpeg4 && sudo apt install libswscale-dev libavcodec-dev libavformat-dev libswresample-dev libavutil-dev libasound2-dev

    - name: Build
      run: go build -v ./...

    - name: Build Docs (to verify it works on PRs)
      run: core build js -dir docs -o static

    - name: Download testdata
      uses: dawidd6/action-download-artifact@v21
      with:
        name: testdata
        workflow_search: true
        search_artifacts: true
        if_no_artifact_found: warn

    # The snapshots of real pages of htmlcore (saved with their resources,
    # see htmlcore/snapshot_test.go) are not in the repository: they are
    # saved from the web once, when there are none, and kept as an artifact,
    # so that they stay the same for the regression tests of htmlcore.
    - name: Download htmlcore snapshots
      id: snapshots
      uses: dawidd6/action-download-artifact@v21
      with:
        name: htmlcore-snapshots
        path: htmlcore/testdata/snapshots
        workflow_search: true
        search_artifacts: true
        if_no_artifact_found: warn

    - name: Save htmlcore snapshots
      if: steps.snapshots.outputs.found_artifact != 'true'
      continue-on-error: true # a page that cannot be saved is left out
      run: go test ./htmlcore -run TestSnapshot -snapshot -v

    - name: Set CORE_UPDATE_TESTDATA env var
      if: inputs.updateTestdata
      run: echo "CORE_UPDATE_TESTDATA=true" >> $GITHUB_ENV

    # TODO: we can't test gpu, xyz, system, and video on the CI since there is bad Vulkan support
    - name: Test
      run: go test -short -v $(go list ./... | grep -v gpu | grep -v xyz | grep -v system | grep -v video) -coverprofile cover.out -timeout 2m

    - name: Upload testdata
      uses: actions/upload-artifact@v7
      with:
        name: testdata
        path: |
          **/testdata/**/*.png
          !htmlcore/testdata/snapshots/**

    - name: Upload htmlcore snapshots
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: htmlcore-snapshots
        path: htmlcore/testdata/snapshots/
        if-no-files-found: ignore

    - name: Upload failure testdata
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: testdata-fail
        path: "**/testdata/**/*.png"

    - name: Update coverage report
      uses: ncruces/go-coverage-report@v0
      with:
        coverage-file: cover.out
      if: github.event_name == 'push'
