<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="640" height="480" viewBox="0 0 640 480">
  <defs>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="lightyellow"/>
      <circle cx="10" cy="10" r="6" fill="red"/>
    </pattern>
    <pattern id="checker" width="0.25" height="0.25">
      <rect width="20" height="20" fill="black"/>
      <rect x="20" y="20" width="20" height="20" fill="black"/>
    </pattern>
    <pattern id="stripes" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="16" fill="navy"/>
    </pattern>
    <pattern id="vb" width="40" height="40" patternUnits="userSpaceOnUse" viewBox="0 0 4 4">
      <path d="M0 0 H2 V2 H0 Z" fill="green"/>
    </pattern>
    <pattern id="ref" href="#vb" x="10"/>
  </defs>
  <rect x="20" y="20" width="180" height="180" fill="url(#dots)" stroke="black"/>
  <rect x="240" y="40" width="160" height="160" fill="url(#checker)"/>
  <circle cx="520" cy="110" r="90" fill="url(#stripes)"/>
  <rect x="20" y="260" width="200" height="200" fill="url(#vb)"/>
  <rect x="260" y="260" width="160" height="160" fill="url(#ref)"/>
  <rect x="460" y="260" width="160" height="160" fill="none" stroke="url(#dots)" stroke-width="30"/>
</svg>
