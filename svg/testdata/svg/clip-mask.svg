<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="640" height="480" viewBox="0 0 640 480">
  <defs>
    <clipPath id="circle">
      <circle cx="100" cy="100" r="60"/>
    </clipPath>
    <clipPath id="bbox" clipPathUnits="objectBoundingBox">
      <polygon points="0.5,0 1,1 0,1"/>
    </clipPath>
    <clipPath id="ring" clip-rule="evenodd">
      <path d="M 340 40 h 120 v 120 h -120 z M 370 70 h 60 v 60 h -60 z"/>
    </clipPath>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="white"/>
      <stop offset="1" stop-color="black"/>
    </linearGradient>
    <mask id="fadeMask">
      <rect x="40" y="220" width="160" height="160" fill="url(#fade)"/>
    </mask>
    <mask id="holeMask" maskUnits="userSpaceOnUse" x="240" y="220" width="160" height="160">
      <rect x="0" y="0" width="640" height="480" fill="white"/>
      <circle cx="320" cy="300" r="40" fill="black"/>
    </mask>
  </defs>
  <rect x="40" y="40" width="120" height="120" fill="red" clip-path="url(#circle)"/>
  <rect x="200" y="40" width="120" height="120" fill="green" clip-path="url(#bbox)"/>
  <g clip-path="url(#ring)">
    <rect x="320" y="20" width="160" height="160" fill="blue"/>
  </g>
  <rect x="60" y="40" width="120" height="120" fill="orange" style="clip-path: url('#circle')" transform="translate(440 0)"/>
  <rect x="40" y="220" width="160" height="160" fill="purple" mask="url(#fadeMask)"/>
  <rect x="240" y="220" width="160" height="160" fill="teal" mask="url(#holeMask)"/>
  <g opacity="0.5">
    <rect x="440" y="220" width="120" height="120" fill="black"/>
    <rect x="480" y="260" width="120" height="120" fill="black"/>
  </g>
  <a href="https://example.com"><circle cx="100" cy="440" r="30" fill="navy"/></a>
  <foreignObject x="200" y="400" width="100" height="60"><circle cx="250" cy="440" r="30" fill="red"/></foreignObject>
  <circle cx="400" cy="440" r="30" fill="brown"/>
</svg>
