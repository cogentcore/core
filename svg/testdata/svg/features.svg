<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480">
  <style>
    .blue { fill: blue; }
    g.outline rect { stroke: black; stroke-width: 4; }
    #special { fill: orange; }
    rect:first-child { opacity: 1; }
  </style>
  <defs>
    <linearGradient id="refl" x1="0" x2="0.25" spreadMethod="reflect">
      <stop offset="0" stop-color="red"/><stop offset="1" stop-color="yellow"/>
    </linearGradient>
    <linearGradient id="rot" gradientTransform="rotate(90)">
      <stop offset="0" stop-color="green"/><stop offset="1" stop-color="white"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="crimson"/>
    </marker>
  </defs>
  <svg x="20" y="20" width="120" height="120" viewBox="0 0 10 10">
    <circle cx="5" cy="5" r="5" fill="purple"/>
  </svg>
  <rect x="160" y="20" width="120" height="120" class="blue"/>
  <g class="outline"><rect x="300" y="20" width="120" height="120" fill="none"/></g>
  <rect id="special" x="440" y="20" width="120" height="120" fill="green"/>
  <rect x="20" y="160" width="200" height="60" fill="url(#refl)"/>
  <rect x="240" y="160" width="120" height="120" fill="url(#rot)"/>
  <rect x="380" y="160" width="120" height="60" rx="20%" fill="teal"/>
  <text x="80" y="260" text-anchor="middle" font-size="24">Mid<tspan fill="red" dy="10">dle</tspan></text>
  <text x="560" y="200" text-anchor="end" font-size="20" opacity="0.5">End</text>
  <line x1="20" y1="300" x2="300" y2="300" stroke="black" stroke-width="6" stroke-dasharray="20 10" stroke-linecap="round"/>
  <path d="M 340 320 L 460 320 L 520 400" fill="none" stroke="black" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <polyline points="20,340 80,420 140,340 200,420" fill="none" stroke="navy" stroke-width="12" stroke-linejoin="round"/>
  <circle cx="250" cy="400" r="40" fill="gold" stroke="black" stroke-width="10" style="paint-order: stroke"/>
  <rect x="560" y="400" width="60" height="60" fill="red" display="none"/>
  <ellipse cx="590" cy="420" rx="40" ry="20" fill="lime" transform="rotate(30 590 420)"/>
</svg>
